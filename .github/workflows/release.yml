name: Build & Release APK

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  # Allow a manual run from the Actions tab for testing (no release is published).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openhoy.jks"
            echo "path=$RUNNER_TEMP/openhoy.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret set — release will be debug-signed." >&2
          fi

      - name: Build release APK
        env:
          OPENHOY_KEYSTORE: ${{ steps.keystore.outputs.path }}
          OPENHOY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OPENHOY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OPENHOY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="0.0.0-dev"; fi
          ./gradlew assembleRelease --no-daemon \
            -PversionName="$VERSION" \
            -PversionCode="${{ github.run_number }}"

      - name: Stage APK
        run: cp app/build/outputs/apk/release/app-release*.apk "OpenHoy-${{ github.ref_name }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenHoy-${{ github.ref_name }}
          path: OpenHoy-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: OpenHoy-${{ github.ref_name }}.apk
          generate_release_notes: true
